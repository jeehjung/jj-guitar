<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JJ 기타</title>
  <meta name="description" content="코드를 입력하면 기타·베이스 운지법을 보여주고, 마이크 튜너로 줄을 맞출 수 있어요." />
  <meta name="theme-color" content="#1c1410" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body data-mode="guitar">
  <header class="top">
    <div class="brand"><span class="pick" aria-hidden="true"></span><span>JJ 기타</span></div>
    <div class="mode" role="group" aria-label="악기 선택">
      <button type="button" class="mode-btn" data-mode="guitar">어쿠스틱</button>
      <button type="button" class="mode-btn" data-mode="bass">베이스</button>
    </div>
    <button type="button" id="account" class="account" aria-label="로그인"></button>
  </header>

  <main>
    <section id="view-chord" class="view">
      <form id="chord-form" class="search" autocomplete="off">
        <input id="chord-input" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="코드 입력 (예: Am7, G/B)" aria-label="코드 입력" />
        <button class="btn primary" type="submit">찾기</button>
      </form>
      <div class="picker">
        <div id="root-chips" class="chips scroll" aria-label="근음 선택"></div>
        <div id="quality-chips" class="chips scroll" aria-label="코드 종류 선택"></div>
      </div>
      <div class="settings">
        <label class="sel"><span>튜닝</span><select class="tuning-select" aria-label="튜닝"></select></label>
        <label class="sel guitar-only"><span>카포</span><select id="capo-select" aria-label="카포"></select></label>
      </div>
      <div id="recent" class="chips recent"></div>
      <div id="result"></div>
    </section>

    <section id="view-tuner" class="view" hidden>
      <div class="card tuner">
        <div class="tuner-top">
          <label class="sel"><span>튜닝</span><select class="tuning-select" aria-label="튜닝"></select></label>
        </div>
        <div id="tuner-display" class="tuner-display">
          <div class="meter" aria-hidden="true">
            <div class="scale"><span>낮음</span><span>높음</span></div>
            <div class="arc"></div>
            <div id="needle" class="needle"></div>
          </div>
          <div class="readout">
            <div id="tuner-note" class="note">–</div>
            <div class="sub"><span id="tuner-octave"></span><span id="tuner-cents" class="cents"></span></div>
          </div>
          <p id="tuner-hint" class="hint">마이크 권한을 허용하면 바로 음을 들을 수 있어요</p>
          <p id="tuner-hz" class="muted small hz"></p>
        </div>
        <div id="tuner-strings" class="chips strings" aria-label="줄 선택"></div>
        <p class="muted small center">줄 버튼을 누르면 기준음이 나오고 그 줄에 고정돼요.</p>
        <button type="button" id="tuner-toggle" class="btn primary block big">튜너 시작</button>
        <button type="button" id="save-tuning-btn" class="btn block ghost">+ 내 튜닝 만들기</button>
      </div>
    </section>

    <section id="view-saved" class="view" hidden>
      <div id="saved"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="메뉴">
    <button type="button" class="tab-btn" data-tab="chord" aria-current="page">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 8h14M9.7 3v18M14.3 3v18"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
      <span>코드</span>
    </button>
    <button type="button" class="tab-btn" data-tab="tuner" aria-current="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-6"/></svg>
      <span>튜너</span>
    </button>
    <button type="button" class="tab-btn" data-tab="saved" aria-current="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <span>내 저장</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <button type="button" class="sheet-close" data-close aria-label="닫기">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
