name: Deploy JJ Guitar production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guitarcode-main-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Verify secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Stamp version for cache busting
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::7}"
          rm -rf build && cp -R public build
          sed -i -E "s#(href|src)=\"(css/app\.css|js/app\.js)\"#\1=\"\2?v=$V\"#g" build/index.html
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$V\"#g" build/js/*.js
          grep -q "app.js?v=$V" build/index.html
          grep -q "?v=$V" build/js/app.js

      - name: Deploy production to Cloudflare Pages (guitarcode)
        run: npx --yes wrangler@4 pages deploy build --project-name=guitarcode --branch=main --commit-dirty=true
