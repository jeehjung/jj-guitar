name: Deploy JJ Guitar development

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

# 개발·운영 배포가 같은 gh-pages 브랜치를 쓰므로 동시에 실행되지 않도록 묶음
concurrency:
  group: jj-guitar-gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Stamp version for cache busting
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::7}"
          rm -rf build && cp -R public build
          sed -i -E "s#(href|src)=\"(css/app\.css|js/app\.js)\"#\1=\"\2?v=$V\"#g" build/index.html
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$V\"#g" build/js/*.js
          grep -q "app.js?v=$V" build/index.html
          grep -q "?v=$V" build/js/app.js

      - name: Publish to gh-pages (/dev/ 경로만 교체)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add --detach site FETCH_HEAD
          else
            git worktree add --detach site
            (cd site && git checkout --orphan gh-pages && git rm -rfq --ignore-unmatch . && git clean -fdq)
          fi
          rm -rf site/dev
          mkdir -p site/dev
          cp -R build/. site/dev/
          touch site/.nojekyll
          cd site
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "Deploy development from ${GITHUB_SHA::7}"
          git push origin HEAD:refs/heads/gh-pages
