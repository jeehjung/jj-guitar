name: Deploy JJ Guitar development

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jj-guitar-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Verify secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)
          test -n "$GOOGLE_CLIENT_SECRET" || (echo "Missing GOOGLE_CLIENT_SECRET repository secret" && exit 1)

      - name: Ensure development Pages project and D1 database
        run: .github/scripts/ensure-cloudflare.sh jj-guitar-dev dev jj-guitar-dev https://jj-guitar-dev.pages.dev

      - name: Apply development D1 migrations
        run: npx wrangler d1 migrations apply jj-guitar-dev --remote

      - name: Configure Google OAuth secret
        run: printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler pages secret put GOOGLE_CLIENT_SECRET --project-name=jj-guitar-dev

      - name: Deploy development Pages site
        run: npx wrangler pages deploy public --project-name=jj-guitar-dev --branch=dev --commit-dirty=true
